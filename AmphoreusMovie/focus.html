<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmphoreusMovie</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" type="module"></script>
  </head>
  <body>
    <header>
      <div id="headLogo">
        <a href="index.html" style="color: white; text-decoration: none">
          <i class="fa-solid fa-film"></i>
        </a>
      </div>
      <nav id="desktopNav">
        <ul>
          <li><a href="index.html?view=movie">Films</a></li>
          <li><a href="index.html?view=tv">Séries</a></li>
          <li><a href="index.html?view=popular">Populaires</a></li>
        </ul>
      </nav>
      <div
        id="mobileMenu"
        style="display: none; font-size: 32px; cursor: pointer"
      >
        <i class="fa-solid fa-bars"></i>
      </div>
    </header>
    <main>
      <h1 style="display: none">Détails</h1>

      <section id="detailsPage">
        <div class="movieBanner">
          <div class="bannerContent">
            <div class="bannerPosterContainer">
              <img
                id="detailPoster"
                src="./image/photoSansVisage.jpg"
                alt="Affiche"
              />
            </div>
            <div class="bannerInfo">
              <div class="titleRow">
                <div class="voteCircle" id="detailVote"></div>
                <div class="titleBlock">
                  <h2 id="detailTitle">Chargement...</h2>
                  <p id="detailSubtitle"></p>
                </div>
              </div>
              <div class="synopsisBlock">
                <h3>Synopsis</h3>
                <p id="detailSynopsis"></p>
              </div>
            </div>
          </div>
        </div>
        </div> <div class="trailerSection">
          <h2>Bande Annonce</h2>
          <div id="detailTrailer"></div>
        </div>

        <div class="castingSection">
        <div class="castingSection">
          <h2>Casting</h2>
          <div class="castGrid" id="castList"></div>
        </div>
      </section>
    </main>
  </body>
</html>
