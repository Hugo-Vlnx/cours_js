<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmphoreusMovie</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer type="module"></script>
  </head>
  <body>
    <header>
      <div id="headLogo">
        <i class="fa-solid fa-film"></i>
      </div>
      <nav id="desktopNav">
        <ul>
          <li><a href="#">Films</a></li>
          <li><a href="#">Séries</a></li>
          <li><a href="#">Populaires</a></li>
        </ul>
      </nav>
      <div id="mobileMenu" style="display: none; font-size: 32px; cursor: pointer;">
        <i class="fa-solid fa-bars"></i>
      </div>
    </header>
    <main>
      <section class="searching">
        <form class="searchBar" action="#" method="GET">
          <input
            type="text"
            id="searchInput"
            placeholder="Rechercher un film, une série..."
            autocomplete="off"
          />
          <button type="submit" aria-label="Rechercher">
            <i class="fa-solid fa-search"></i>
          </button>
        </form>
      </section>

      <section id="searchPage" class="categories" style="display: none">
        <div class="category" style="height: auto">
          <div class="categoryHeader">
            <h2 id="searchTitle">Résultats de recherche</h2>
          </div>
          <div class="movieList searchGrid"></div>
        </div>
      </section>
      <section id="detailsPage" style="display: none">
        <div class="movieBanner">
          <div class="bannerContent">
            <div class="bannerPosterContainer">
              <img id="detailPoster" src="" alt="Affiche" />
            </div>
            <div class="bannerInfo">
              <div class="titleRow">
                <div class="voteCircle" id="detailVote"></div>
                <div class="titleBlock">
                  <h2 id="detailTitle"></h2>
                  <p id="detailSubtitle"></p>
                </div>
              </div>
              <div class="synopsisBlock">
                <h3>Synopsis</h3>
                <p id="detailSynopsis"></p>
              </div>
            </div>
          </div>
        </div>

        <div class="castingSection">
          <h2>Casting</h2>
          <div class="castGrid" id="castList"></div>
        </div>
      </section>
      <div id="homePage">
        <section class="categories">
          <div class="category">
            <div class="categoryHeader">
              <h2>Tendances</h2>
              <div class="choiceButton">
                <button>Aujourd'hui</button>
                <button>Cette semaine</button>
              </div>
            </div>
            <div class="movieList"></div>
          </div>
        </section>

        <div class="grayBG">
          <section class="categories">
            <div class="category">
              <div class="categoryHeader">
                <h2>Films</h2>
                <div class="choiceButton">
                  <button>Mieux notées</button>
                  <button>Populaires</button>
                </div>
              </div>
              <div class="movieList"></div>
            </div>
          </section>
        </div>

        <section class="categories">
          <div class="category">
            <div class="categoryHeader">
              <h2>Séries</h2>
              <div class="choiceButton">
                <button>Mieux notées</button>
                <button>Populaires</button>
              </div>
            </div>
            <div class="movieList"></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
